		}

		/* BACKGROUND AESTHETIC */
		.aesthetic-background {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			background: linear-gradient(135deg, #f5f0e6 0%, #f9f7f7 100%);
			opacity: 0.9;
		}

		.floating-elements {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			overflow: hidden;
		}

		.floating-element {
			position: absolute;
			opacity: 0.1;
			animation: float 30s infinite linear;
		}

		@keyframes float {
			0% {
				transform: translate(0, 0) rotate(0deg);
			}

			100% {
				transform: translate(100vw, -100vh) rotate(360deg);
			}
		}

		/* MENU UTAMA */
		.menu-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 30px;
			padding: 40px;
			max-width: 1000px;
			margin: 0 auto;
			position: relative;
		}

		.menu-item {
			background-color: white;

			height: 220px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			cursor: pointer;
			transition: all 0.3s ease;
			position: relative;
			overflow: hidden;
			padding: 20px;
			border: 1px solid rgba(93, 64, 55, 0.1);
		}

		.menu-item::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 8px;
			background: linear-gradient(90deg, var(--pastel-taupe), var(--pastel-beige));
		}

		.menu-item:hover {
			transform: translateY(-8px);
			box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
		}

		.menu-icon {
			font-size: 80px;
			margin-bottom: 20px;

		}

		.menu-item:hover .menu-icon {

		.menu-text {

	<script>
		// Create floating aesthetic elements
		document.addEventListener('DOMContentLoaded', function () {
			const container = document.getElementById('floatingElements');
			const shapes = [
				'M20,50 Q30,30 40,50 T60,50 T80,50 T100,50 T120,50', // Wave
				'M10,10 L90,10 L50,90 Z', // Triangle
				'M20,20 H80 V80 H20 Z', // Square
				'M50,20 A30,30 0 1,1 50,80 A30,30 0 1,1 50,20 Z' // Circle
			];

			const colors = ['#8d6e63', '#a1887f', '#bcaaa4', '#d7ccc8'];

			for (let i = 0; i < 15; i++) {
				const element = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
				element.setAttribute('viewBox', '0 0 100 100');
				element.setAttribute('class', 'floating-element');
				element.style.width = `${Math.random() * 200 + 100}px`;
				element.style.height = `${Math.random() * 200 + 100}px`;
				element.style.left = `${Math.random() * 100}%`;
				element.style.top = `${Math.random() * 100}%`;
				element.style.opacity = `${Math.random() * 0.1 + 0.05}`;
				element.style.animationDuration = `${Math.random() * 40 + 20}s`;
				element.style.animationDelay = `${Math.random() * 10}s`;

				const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
				path.setAttribute('d', shapes[Math.floor(Math.random() * shapes.length)]);
				path.setAttribute('fill', colors[Math.floor(Math.random() * colors.length)]);

				element.appendChild(path);
				container.appendChild(element);
			}
		});
	</script>
